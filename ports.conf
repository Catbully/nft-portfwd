# ports.conf — apply.sh 的规则清单
#
# 一行一条规则，`#` 之后是注释。解析失败时整份配置不落地。
#
# 形式一 · 放行本机端口（不转发）
#   allow <端口[,端口...]> [tcp|udp]
#   省略协议 = tcp 与 udp 都放行
#
# 形式二 · 端口转发（本机端口 -> 目标主机:目标端口）
#   <本机端口> -> <目标IPv4或域名>:<目标端口> [tcp|udp]
#   省略协议 = tcp。目标只支持 IPv4（域名会在加载时解析成 IPv4）。

# 形式三 · 源地址伪装开关（可选，默认 on）
#   snat on | snat off
#   on  = 落地目标看到本机 IP（公网→公网中转必须 on）
#   off = 落地目标看到客户端真实 IP（目标回程本来就经过本机时才可用）
#
# 也可以直接跑 `sudo ./menu.sh` 用交互式菜单增删规则。

allow 22 tcp

# 放行但不转发
#allow 80,443 tcp

# 端口转发示例：访问本机 443，实际落到 203.0.113.10 的 443
#443 -> 203.0.113.10:443 tcp

# 同端口号 TCP + UDP 各转一份
#8443 -> 203.0.113.10:8443 tcp
#8443 -> 203.0.113.10:8443 udp
